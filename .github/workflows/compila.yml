# Compila el mod a cada push a master (i a mà des de la pestanya Actions).
# El jar queda com a artefacte de l'execució, amb el commit al nom:
# així sempre se sap de quin codi surt el jar que es puja al servidor.
name: Compila

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gradle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compila i prova
        run: ./gradlew build --no-daemon

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proves-${{ github.sha }}
          path: build/reports/tests/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: pauitreva-${{ github.sha }}
          path: build/libs/*.jar
