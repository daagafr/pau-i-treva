# Substitueix el bloc meta-formatting de config/luckperms/luckperms.conf del Create (no el del MineUAB).
# El prefix és una pila: el rang (track staff), la universitat (el prefix més alt que no és de staff) i el país
# (el prefix propi del jugador, que posa Pau i Treva amb prioritat 5 i només amb server=create). Cada prefix ja
# porta l'espai al final, per això middle-spacer és buit. Si algú no té universitat, el segon i el tercer són el
# mateix (el país) i «first-only» en deixa un.
meta-formatting {
  prefix {
    format = [
      "highest_on_track_staff"
      "highest_not_on_track_staff"
      "highest_own"
    ]
    duplicates = "first-only"
    start-spacer = ""
    middle-spacer = ""
    end-spacer = ""
  }
  suffix {
    format = [
      "highest"
    ]
    duplicates = "first-only"
    start-spacer = ""
    middle-spacer = " "
    end-spacer = ""
  }
}
